	 $('.qa_title').css({'margin-top':'-15px','margin-left':'30%',height:'20px','padding':'2px',width:"600px"});
	$('.qa_title').mouseenter(function(){
         $(this).css("background-color", "rgba(0,0,0,0.2)");
    });
	 
    $('.qa_title').mouseleave(function(){
         $(this).css("background-color", "transparent");
    });
	 
	 
	 
	  
	 $('.qa_title').click(function(){
		var t=$(this).text(); 
		var search=$(this).parent().closest('ul').html();
		 $('#showtitle').html(t);
		 $('.modal-body').html(search).find('.qa_content').show();
		 $('.modal-body').find('.qa_title').hide();
		 $('.qa_content').find('img').css('max-width','100%');
		 
	 })
