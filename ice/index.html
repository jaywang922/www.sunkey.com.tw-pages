<script type="text/javascript">
function headerImg()
{
	$('#banner img').each(function(){
		$total = $('#banner img').size() ;
		if($(this).is(':visible'))
		{
			$nextImg = parseInt($(this).index('#banner img'))+1 ;
			if( parseInt($nextImg) > (parseInt($total)-1) )
			{
				$nextImg = 0 ;
			}
		}
		$('.bannerIcon li a').removeClass('iconOn') ;
		$('.bannerIcon li a').eq($nextImg).addClass('iconOn') ;
	}) ;
	$('#banner img').each(function(){
		if( parseInt($(this).index('#banner img')) == $nextImg )
		{
			$(this).fadeIn('slow') ;
			$words = $(this).parent().next().text() ;
			$('.bannerFontBg').html($words) ;

			
			//alert(str_replace("\\",$(this).attr('alt'))) ;
			
			
		}
		else
		{
			$(this).fadeOut('slow') ;
		}
	}) ;
}
$(document).ready(function(){
	$('.bannerIcon li a').eq(0).addClass('iconOn') ;
	$('.bannerIcon li').click(function(){
	
		$nowclick = parseInt($(this).index()) ;

		
		$('#banner img').each(function(){
			if( parseInt($(this).index('#banner img')) == $nowclick )
			{
				$(this).fadeIn('slow') ;
				$words = $(this).parent().next().text() ;
				$('.bannerFontBg').html($words) ;
			}
			else
			{
				$(this).fadeOut('slow') ;
			}
		}) ;
		$('.bannerIcon li a').removeClass('iconOn') ;
		$(this).find('a').addClass('iconOn') ;
		clearTimeout(timer);
		timer = setInterval("headerImg()",sec*time) ;
		return false ;
	}) ;
	$("#banner img:not(:first)").css('display','none');
	var time = 1000 ; 
	//秒數
	var sec = 10 ;
	timer = setInterval("headerImg()",sec*time) ;
}) ;

</script>
