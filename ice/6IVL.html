<div style=" position:fixed; z-index:-999; color:#D8BA8C;">  
精選巴西咖啡原豆，口感中帶點微酸，又帶點些許的甘苦味，入口極為滑順而餘味的香氣更是經典。柔和的口感最適合義式濃縮咖啡及花式咖啡的各種變化。
咖啡職人追求極品拿鐵的關鍵是「牛奶與咖啡的比例是調和」，濃郁的奶香混合著咖啡香，淺淺品嘗那多變的味覺層次，無法以言語形容的享受，更是一種追求味覺的最高境界。
